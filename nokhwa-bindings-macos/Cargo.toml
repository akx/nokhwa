[package]
name = "nokhwa-bindings-macos"
version = "0.2.4"
edition = "2021"
authors = ["l1npengtul"]
license = "Apache-2.0"
repository = "https://github.com/l1npengtul/nokhwa"
description = "The AVFoundation bindings crate for `nokhwa`"
keywords = ["avfoundation", "macos", "capture", "webcam"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[dependencies.nokhwa-core]
version = "0.1"
path = "../nokhwa-core"

[target.'cfg(any(target_os="macos",target_os="ios"))'.dependencies]
core-media-sys = "0.1"
core-foundation = "0.10"
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
block2 = "0.6"
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer"] }
flume = "0.11"
once_cell = "1"
